  <title id="title">Idle terminal UI: memory and CPU</title>
  <desc id="desc">Memory (RSS): Kraai 40 MB, Codex 0.167.0 274 MB, Claude Code 2.1.322 270 MB; CPU, first 30 s: Kraai 0.06 s, Codex 0.167.0 0.87 s, Claude Code 2.1.322 2.9 s; CPU while idle: Kraai 0.02%, Codex 0.167.0 0.8%, Claude Code 2.1.322 0.23%</desc>
