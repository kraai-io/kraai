name: Build Kraai Release Binaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: macos-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build Kraai (release)
        run: cargo build -p tui --release
      - name: Prepare Kraai artifact
        shell: bash
        run: cp "target/release/tui${{ matrix.ext }}" "target/release/kraai${{ matrix.ext }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kraai-${{ runner.os }}
          path: target/release/kraai${{ matrix.ext }}
