name: Sandbox behavior
on:
  pull_request:
  push:
    branches: [main, t3code/combine-pull-request-features]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo check --locked --workspace --all-targets
      - if: runner.os == 'Windows'
        id: install-helper
        run: |
          cargo build --locked -p kraai-sandbox --bin kraai-sandbox-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/debug/kraai-sandbox-helper.exe install
          exit $LASTEXITCODE
      - run: cargo test --locked -p kraai-sandbox -p kraai-nushell-runtime -p kraai-workspace-fs --all-targets --no-fail-fast
      - if: always() && runner.os == 'Windows' && steps.install-helper.outcome == 'success'
        run: cargo test --locked -p kraai-sandbox --lib windows_helper::tests::service_restart_recovers_owned_exemptions -- --exact --ignored --nocapture
      - if: always() && runner.os == 'Windows' && steps.install-helper.outcome == 'success'
        run: ./.github/windows-standard-user.ps1
      - if: always() && runner.os == 'Windows'
        run: |
          if (Get-Service KraaiSandbox -ErrorAction SilentlyContinue) {
            & ./target/debug/kraai-sandbox-helper.exe uninstall
            exit $LASTEXITCODE
          }
