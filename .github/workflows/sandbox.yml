name: Sandbox behavior
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked -p kraai-io -p kraai-sandbox -p kraai-nushell-runtime -p kraai-workspace-fs --all-targets --all-features --no-fail-fast
      - run: cargo test --locked -p kraai-eval --lib executable_lookup_tests
      - run: cargo test --locked -p kraai-tui app::composer::tests::editor_command
      - run: npm ci --prefix packages/runtime
      - run: npm run build --prefix packages/runtime
      - run: npm run typecheck --prefix packages/runtime
      - run: npm test --prefix packages/runtime
      - run: cargo test --locked -p kraai-tui app::workspace_preferences::tests
      - if: runner.os == 'Windows'
        run: ./.github/windows-standard-user.ps1
