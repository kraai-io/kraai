[package]
edition.workspace = true
license.workspace = true
name = "kraai-nushell-runtime"
publish = false
rust-version.workspace = true
version = "0.1.0"

[dependencies]
base64.workspace = true
hmac = { workspace = true }
kraai-commands = { workspace = true, features = ["nushell"] }
kraai-execution-types = { workspace = true }
kraai-io.workspace = true
kraai-mcp.workspace = true
kraai-sandbox = { workspace = true }
kraai-web.workspace = true
nu-cli = { workspace = true }
nu-cmd-lang = { workspace = true }
nu-command = { workspace = true }
nu-config = { workspace = true }
nu-engine = { workspace = true }
nu-experimental = { workspace = true }
nu-json = { workspace = true }
nu-parser = { workspace = true }
nu-protocol = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
ulid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }

[[bin]]
name = "kraai-nushell-host"
path = "src/bin/kraai-nushell-host.rs"

[dev-dependencies]
async-trait.workspace = true
kraai-test-support = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
