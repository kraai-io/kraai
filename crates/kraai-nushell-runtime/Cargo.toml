[package]
edition.workspace = true
license.workspace = true
name = "kraai-nushell-runtime"
publish = false
rust-version.workspace = true
version = "0.1.0"

[dependencies]
base64.workspace = true
hmac = { workspace = true }
kraai-command-catalog.workspace = true
kraai-command-close-files = { workspace = true }
kraai-command-core = { workspace = true }
kraai-command-edit-file = { workspace = true }
kraai-command-open-files = { workspace = true }
kraai-command-view-image.workspace = true
kraai-command-web-search.workspace = true
kraai-sandbox = { workspace = true }
kraai-types = { workspace = true }
kraai-web.workspace = true
nu-cli = { workspace = true }
nu-cmd-lang = { workspace = true }
nu-command = { workspace = true }
nu-config = { workspace = true }
nu-protocol = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
ulid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }

[[bin]]
name = "kraai-nushell-host"
path = "src/bin/kraai-nushell-host.rs"

[dev-dependencies]
async-trait.workspace = true
kraai-command-catalog = { workspace = true }
