[package]
edition.workspace = true
license.workspace = true
name = "kraai-commands"
publish = false
rust-version.workspace = true
version = "0.1.0"

[features]
nushell = [
  "dep:base64",
  "dep:kraai-io",
  "dep:kraai-workspace-fs",
  "dep:nu-engine",
  "dep:nu-protocol",
  "dep:serde_json",
]

[dependencies]
base64 = { workspace = true, optional = true }
kraai-io = { workspace = true, optional = true }
kraai-types.workspace = true
kraai-workspace-fs = { workspace = true, optional = true }
nu-engine = { workspace = true, optional = true }
nu-protocol = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }
