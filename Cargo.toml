[workspace]
members = [
  "crates/kraai-agent",
  "crates/commands/kraai-command-open-files",
  "crates/commands/kraai-command-close-files",
  "crates/commands/kraai-command-edit-file",
  "crates/kraai-command-core",
  "crates/kraai-nushell-runtime",
  "crates/kraai-sandbox",
  "crates/kraai-script-protocol",
  "crates/kraai-eval",
  "crates/kraai-persistence",
  "crates/kraai-runtime",
  "crates/kraai-tui",
  "crates/kraai-types",
  "crates/kraai-workspace-fs",
  "crates/llm-providers/kraai-provider-core",
  "crates/llm-providers/kraai-provider-openai-chat-completions",
  "crates/llm-providers/kraai-provider-openai-codex",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.0"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true        # Enables Link-time Optimization.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true      # Ensures debug symbols are removed.

[workspace.dependencies]
kraai-agent = { path = "crates/kraai-agent" }
kraai-command-close-files = { path = "crates/commands/kraai-command-close-files" }
kraai-command-core = { path = "crates/kraai-command-core" }
kraai-command-edit-file = { path = "crates/commands/kraai-command-edit-file" }
kraai-command-open-files = { path = "crates/commands/kraai-command-open-files" }
kraai-eval = { path = "crates/kraai-eval" }
kraai-nushell-runtime = { path = "crates/kraai-nushell-runtime" }
kraai-persistence = { path = "crates/kraai-persistence" }
kraai-provider-core = { path = "crates/llm-providers/kraai-provider-core" }
kraai-provider-openai-chat-completions = { path = "crates/llm-providers/kraai-provider-openai-chat-completions" }
kraai-provider-openai-codex = { path = "crates/llm-providers/kraai-provider-openai-codex" }
kraai-runtime = { path = "crates/kraai-runtime" }
kraai-sandbox = { path = "crates/kraai-sandbox" }
kraai-script-protocol = { path = "crates/kraai-script-protocol" }
kraai-types = { path = "crates/kraai-types" }
kraai-workspace-fs = { path = "crates/kraai-workspace-fs" }

arboard = "3.6.1"
async-trait = "0.1.89"
atomic-write-file = "0.3.0"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
futures = "0.3.32"
hmac = "0.12.1"
httpdate = "1.0.3"
ignore = "0.4.28"
libc = "0.2.186"
nix = { version = "0.30.1", features = ["process", "signal"] }
notify = "8.2.0"
nu-cli = "=0.114.1"
nu-cmd-lang = "=0.114.1"
nu-command = "=0.114.1"
nu-engine = "=0.114.1"
nu-parser = "=0.114.1"
nu-path = "=0.114.1"
nu-protocol = "=0.114.1"
proc-macro2 = "1.0.106"
quote = "1.0.46"
rand = "0.10.2"
ratatui = { version = "0.30.2", features = [
  "all-widgets",
  "macros",
  "scrolling-regions",
  "serde",
] }
regex = "1.13.0"
reqwest = { features = ["json", "stream"], version = "0.13.4" }
rustix = { version = "1.1.4", features = ["fs", "net", "pipe"] }
serde = { features = ["derive"], version = "1.0.228" }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.118", features = ["derive", "extra-traits", "full"] }
tachyonfx = "0.25.1"
textwrap = "0.16.2"
thiserror = "2.0.18"
tokio = { features = ["full"], version = "1.52.3" }
tokio-util = "0.7.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trybuild = "1.0.117"
ulid = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
urlencoding = "2.1.3"
