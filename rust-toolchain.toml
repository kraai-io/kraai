# Nightly only for cargo's `resolver.feature-unification = "workspace"` in .cargo/config.toml, so
# building one package reuses the dependency builds of the whole workspace. Return to stable once
# that setting is stabilized: https://github.com/rust-lang/cargo/issues/14774
[toolchain]
channel = "nightly-2026-10-18"
components = ["clippy", "llvm-tools-preview", "rustfmt"]
profile = "default"
