[advisories]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via wayland-scanner parses bundled protocol XML at build time only" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via wayland-scanner parses bundled protocol XML at build time only" },
]
unmaintained = "workspace"
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CC-PDDC",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[sources]
allow-git = ["https://github.com/Aleph-Alpha/ts-rs"]
unknown-git = "deny"
unknown-registry = "deny"
unused-allowed-source = "deny"
