id = "open-close-files-plural"
max_submission_bytes = 10485760
prompt = """
Replace the singular open_file and close_file tool interfaces with plural open_files and close_files interfaces. Each call must accept a paths list and process every supplied path in order. Return all resolved paths, emit one existing opened-files state delta per path, and preserve the existing read-risk and open-file error semantics across the whole call. Update built-in agent profiles and affected tests or prompt fixtures to use the plural tool names. Use the nix devshell for any commands that you don't have directly on your path.
"""
schema_version = 1

[source]
public_patch = "public.patch"
repository = "../../.."
revision = "029a5df51f60886efc29def554526fe9be2fe739"

[runner]
network = "disabled"
rust_toolchain = true
timeout_seconds = 1800

[grader]
hidden_patch = "hidden.patch"

[[grader.commands]]
command = [
    "cargo",
    "test",
    "-p",
    "kraai-tool-open-file",
    "--test",
    "eval_plural_paths",
]
timeout_seconds = 600

[[grader.commands]]
command = [
    "cargo",
    "test",
    "-p",
    "kraai-tool-close-file",
    "--test",
    "eval_plural_paths",
]
timeout_seconds = 600

[[grader.commands]]
command = [
    "sh",
    "-c",
    "! git grep -n -E 'ToolId::new\\(\"(open_file|close_file)\"\\)|name: \"(open_file|close_file)\"' -- crates/kraai-agent crates/tools/kraai-tool-open-file crates/tools/kraai-tool-close-file",
]
timeout_seconds = 30
