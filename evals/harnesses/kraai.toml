api_key_env = "OPENAI_API_KEY"
args = [
  "--provider",
  "{provider_id}",
  "--model",
  "{model}",
  "--agent-profile",
  "eval-coding",
  "--message",
  "{prompt}",
  "--provider-config",
  "{provider_config}",
]
max_requests = 64
name = "kraai"
program = "kraai-headless"
reasoning_args = ["--option", "reasoning_effort={reasoning}"]
sanitize_kraai_provider = true
schema_version = 1
